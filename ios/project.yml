# Проект Xcode собирается из этого файла: xcodegen generate (brew install xcodegen).
name: KrasnodarTransport
options:
  bundleIdPrefix: ru.khudob1n.krasnodar
  deploymentTarget:
    iOS: "16.0"
targets:
  KrasnodarTransport:
    type: application
    platform: iOS
    sources: [KrasnodarTransport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.khudob1n.krasnodar.transport
        PRODUCT_NAME: Транспорт Краснодара
        INFOPLIST_FILE: KrasnodarTransport/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin собирается только под Apple Silicon (iosSimulatorArm64, iosArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # Общий Kotlin-код (android/shared) - статический фреймворк Shared, его кладёт сюда Gradle.
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../android/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        # Shared и то, что нужно MapLibre внутри maplibre-compose (его документация, iOS).
        OTHER_LDFLAGS: ["-framework", "Shared", "-lc++", "-lz", "-framework", "CoreFoundation", "-framework", "CoreGraphics", "-framework", "CoreText", "-framework", "Foundation", "-framework", "ImageIO", "-framework", "Metal", "-framework", "QuartzCore"]
    preBuildScripts:
      - name: Kotlin (android/shared)
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
          cd "$SRCROOT/../android"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

# Сайт и публичная часть API на одном домене. __DOMAIN__ подставляет setup-server.sh,
# блок HTTPS (listen 443, сертификаты, редирект) дописывает certbot.

# Пешеходный роутинг и геокодер: поиск маршрута - 2-6 запросов, ввод адреса - по запросу на паузу
# в наборе; чужому скрипту хватит и этого.
limit_req_zone $binary_remote_addr zone=krd_walk:10m rate=5r/s;
# Отчёты о сбоях приложения: с одного адреса - не чаще раза в 10 секунд (с запасом на пачку).
limit_req_zone $binary_remote_addr zone=krd_crash:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Наружу - только то, что нужно пассажирской карте, и только на чтение. Вход в админку,
    # пользователи, правка справочников и история движения снаружи недоступны.
    location /api/app/live/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # И без завершающего слэша: приложение запрашивает список коллекций как /api/app/collections.
    location ~ ^/api/app/collections(/|$) {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Пешие маршруты: своего OSRM (deploy/osrm) у Краснодара пока нет - публичный пешеходный OSRM
    # FOSSGIS, как и при локальной разработке (next.config.js). Только маршрут и матрица, только чтение.
    location ~ ^/api/walk/((route|table)/v1/foot/.*)$ {
        limit_except GET { deny all; }
        limit_req zone=krd_walk burst=20 nodelay;
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://routing.openstreetmap.de/routed-foot/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host routing.openstreetmap.de;
        proxy_read_timeout 15s;
    }

    # Свой геокодер (server/src/geocoder.js): поиск адресов и подпись точки на карте.
    location ~ ^/api/(geocode(/reverse)?)$ {
        limit_except GET { deny all; }
        limit_req zone=krd_walk burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080/$1$is_args$args;
        proxy_read_timeout 10s;
    }

    # Картинки превью ссылок на карту (passenger/client/pages/api/og.tsx) - рисует Next.
    # Это работа процессора, поэтому с тем же лимитом частоты.
    location = /api/og {
        limit_except GET { deny all; }
        limit_req zone=krd_walk burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Отчёты о сбоях Android-приложения (admin/api/src/routes/crashReports.js) - только POST.
    location = /api/app/crash-reports {
        limit_except POST { deny all; }
        limit_req zone=krd_crash burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        return 404;
    }

    # Статика Next.js с хешами в именах - кешируется надолго.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
